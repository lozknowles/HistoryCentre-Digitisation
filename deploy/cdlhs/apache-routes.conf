# Included only by the lozknowles.com HTTPS virtual host. No homepage/nav edits.
RedirectMatch 302 "^/cdlhs$" "/cdlhs/index.html"
ProxyPass        "/cdlhs/" "http://127.0.0.1:18674/cdlhs/" connectiontimeout=3 timeout=45 retry=0
ProxyPassReverse "/cdlhs/" "http://127.0.0.1:18674/cdlhs/"

<Location "/cdlhs/">
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 23068672
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(self), geolocation=(), microphone=()"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Cache-Control "no-store"
    Header always set Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'"
</Location>
